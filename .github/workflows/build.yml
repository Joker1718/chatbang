name: Build and Test

on:
  workflow_dispatch:  # Manual trigger

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      - name: Cache Cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }} # --no-default-features
        # --no-default-features disables the "browser" feature, avoiding chromiumoxide dependencies

      - name: Run tests
        run: cargo test --target ${{ matrix.target }} --no-default-features

      - name: Upload binary (optional)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chatbang-${{ matrix.os }}
          path: target/${{ matrix.target }}/release/chatbang${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          if-no-files-found: error
